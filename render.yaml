# Render blueprint for the Aurora API (Fastify + Prisma + Neon + S3).
#
# The monorepo lives in `personal-ai-assistant/`; only the server is deployed.
# Secrets are marked `sync: false` so they are entered in the Render dashboard
# and never committed. PORT is injected by Render and read from process.env.
services:
  - type: web
    name: aurora-api
    runtime: node
    plan: free
    region: ohio
    rootDir: personal-ai-assistant
    buildCommand: npm ci && npm run db:generate && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_DIRECT_URL
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: WEB_ORIGIN
        sync: false
